<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peptides Factory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #f4f6f9; color: #333; }
        
        /* 强制全屏遮罩弹窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex; align-items: center; justify-content: center;
            z-index: 999999; backdrop-filter: blur(5px);
        }
        .modal-card {
            background: #ffffff; border-radius: 12px; width: 90%; max-width: 550px;
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: left;
        }
        .modal-header {
            background-color: #6edccb; padding: 18px 24px;
            font-size: 20px; font-weight: bold; color: #1a202c;
        }
        .modal-body { padding: 24px; color: #4a5568; font-size: 14px; line-height: 1.5; }
        .modal-body p { margin-top: 0; margin-bottom: 18px; color: #2d3748; font-size: 14px; }
        
        /* 邮箱与姓名登记框 */
        .register-box {
            background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px;
            padding: 14px; margin-bottom: 16px;
        }
        .register-box label { font-weight: 600; color: #2d3748; display: block; margin-bottom: 6px; font-size: 13px; }
        .input-control {
            width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px;
            font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 10px;
        }
        .input-control:focus { border-color: #319795; }

        /* 复选框布局（1:1 还原截图） */
        .checkbox-row {
            border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px;
            margin-bottom: 12px; display: flex; align-items: flex-start; gap: 12px; background: #fff;
        }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: #3182ce; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
        .checkbox-row label { cursor: pointer; font-size: 13px; color: #4a5568; line-height: 1.4; }
        .checkbox-row a { color: #6b46c1; text-decoration: underline; font-weight: 600; }

        /* 按钮组 */
        .modal-footer { padding: 12px 24px 24px; display: flex; justify-content: flex-end; gap: 12px; }
        .btn-exit { background: #e53e3e; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-agree { background: #6b46c1; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-agree:disabled { background: #cbd5e0; cursor: not-allowed; opacity: 0.6; }

        /* 主页简易内容 */
        .header-demo { text-align: center; padding: 40px 20px; background: #0a2540; color: white; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #fff; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .bottom-nav div { text-align: center; font-size: 12px; color: #666; }
        .bottom-nav i { font-size: 18px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- 顶栏与主页背景 -->
    <div class="header-demo">
        <h1>TRUE PEPTIDE LABS</h1>
        <p>Please complete age verification and registration to enter.</p>
    </div>

    <!-- 1:1 年龄验证 + 邮箱登记强弹窗 -->
    <div class="modal-overlay" id="ageModal">
        <div class="modal-card">
            <div class="modal-header">
                Age Verification Required
            </div>
            <div class="modal-body">
                <p>This website is restricted. To continue, please confirm you meet the minimum age requirement, submit your email, and accept the agreement below.</p>
                
                <!-- 邮箱与姓名登记区 -->
                <div class="register-box">
                    <label>Researcher Email Registration *</label>
                    <input type="email" id="userEmail" class="input-control" placeholder="Enter your email address..." oninput="checkFormValid()">
                    <input type="text" id="userName" class="input-control" placeholder="Full Name (Optional)" style="margin-bottom:0;">
                </div>

                <!-- 截图同款 4 个复选框 -->
                <div class="checkbox-row">
                    <input type="checkbox" id="c1" onchange="checkFormValid()">
                    <label for="c1">I confirm I am 21+ years of age or older.</label>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="c2" onchange="checkFormValid()">
                    <label for="c2">I agree that products and information on this website are provided for laboratory research use only and are not intended for use in or on humans or animals. I will not use any products or information from this website for diagnosis, treatment, cure, or prevention of any condition. I agree to follow applicable laws and regulations, and I agree to the Terms of Service and Privacy Policy.</label>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="c3" onchange="checkFormValid()">
                    <label for="c3">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="c4">
                    <label for="c4">Remember my choice</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-exit" onclick="location.href='https://www.google.com'">Exit</button>
                <button class="btn-agree" id="submitBtn" disabled onclick="submitForm()">I Agree & Enter</button>
            </div>
        </div>
    </div>

    <!-- 截图 2 底部栏组件 -->
    <div class="bottom-nav">
        <div><i class="fas fa-store"></i>Shop</div>
        <div><i class="fas fa-shopping-cart"></i>Cart (0)</div>
        <div><i class="fas fa-user"></i>My account</div>
    </div>

    <script>
        // 实时验证：必须勾选前3个框 + 填写有效邮箱，按钮才变亮
        function checkFormValid() {
            var email = document.getElementById('userEmail').value.trim();
            var c1 = document.getElementById('c1').checked;
            var c2 = document.getElementById('c2').checked;
            var c3 = document.getElementById('c3').checked;
            var btn = document.getElementById('submitBtn');

            if (c1 && c2 && c3 && email.length > 3 && email.includes('@')) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        // 点击提交保存数据并关闭弹窗
        function submitForm() {
            var email = document.getElementById('userEmail').value;
            localStorage.setItem('registered_email', email);
            if (document.getElementById('c4').checked) {
                localStorage.setItem('verified_user', 'true');
            }
            document.getElementById('ageModal').style.display = 'none';
        }

        // 页面加载判断
        window.onload = function() {
            if (localStorage.getItem('verified_user') === 'true') {
                document.getElementById('ageModal').style.display = 'none';
            } else {
                document.getElementById('ageModal').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
