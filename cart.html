<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Peptides Factory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0a2540;
            --accent-color: #00d4b2;
            --text-dark: #333;
            --bg-light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            color: var(--text-dark);
            background-color: #fff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%; 
            border-bottom: 1px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-img {
            height: 90px; 
            width: auto;
            object-fit: contain;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: 0.3s;
        }
        nav a:hover { color: var(--accent-color); }

        .cart-container { 
            max-width: 1100px; 
            margin: 50px auto; 
            padding: 0 20px; 
            min-height: 400px;
        }
        .cart-title { 
            color: var(--primary-color); 
            font-size: 32px; 
            margin-bottom: 30px; 
            border-bottom: 2px solid #eee; 
            padding-bottom: 10px; 
        }

        .cart-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 40px; 
        }
        .cart-table th { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 15px; 
            text-align: left; 
            font-size: 16px;
        }
        .cart-table td { 
            padding: 20px 15px; 
            border-bottom: 1px solid #eee; 
            vertical-align: middle; 
        }
        
        .item-image { 
            width: 70px; 
            height: 70px; 
            object-fit: contain; 
            background: #f0f0f0; 
            border-radius: 6px; 
            padding: 5px; 
        }
        .item-details { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        .item-name { 
            font-weight: bold; 
            color: var(--primary-color); 
            font-size: 16px; 
        }
        .item-spec { 
            color: #666; 
            font-size: 14px; 
            margin-top: 4px; 
        }

        .qty-control {
            display: flex;
            align-items: center;
        }
        .qty-btn { 
            background: #eee; 
            border: none; 
            padding: 5px 12px; 
            cursor: pointer; 
            font-size: 16px; 
            border-radius: 4px; 
            font-weight: bold;
            transition: 0.2s;
        }
        .qty-btn:hover { background: #ddd; }
        .qty-input { 
            width: 40px; 
            text-align: center; 
            border: 1px solid #ddd; 
            padding: 5px; 
            margin: 0 5px; 
            border-radius: 4px; 
            font-size: 16px; 
        }

        .delete-btn { 
            background: none; 
            border: none; 
            color: #ff4d4d; 
            cursor: pointer; 
            font-size: 18px; 
            transition: 0.3s; 
        }
        .delete-btn:hover { 
            color: #cc0000; 
            transform: scale(1.1); 
        }

        .cart-summary { 
            background: var(--bg-light); 
            padding: 30px; 
            border-radius: 12px; 
            max-width: 400px; 
            margin-left: auto; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        .summary-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 15px; 
            font-size: 16px; 
        }
        .summary-total { 
            font-size: 22px; 
            font-weight: bold; 
            color: var(--primary-color); 
            border-top: 2px solid #ddd; 
            padding-top: 15px; 
            margin-top: 15px; 
        }

        .empty-msg { 
            text-align: center; 
            padding: 60px 0; 
        }
        .empty-msg i { 
            font-size: 60px; 
            color: #ccc; 
            margin-bottom: 20px; 
        }
        .empty-msg p { 
            font-size: 18px; 
            color: #666; 
            margin-bottom: 25px; 
        }
        .shop-link { 
            display: inline-block; 
            background-color: var(--primary-color); 
            color: white; 
            padding: 12px 30px; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        .shop-link:hover { 
            background-color: var(--accent-color); 
            color: var(--primary-color); 
        }

        /* 结算扩展增强样式 */
        .input-style { width:100%; padding:11px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; font-size:14px; }
        .input-style:focus { border-color: var(--accent-color); outline:none; }
        .crypto-panel { background-color:#fcf8e3; border:1px dashed #fbeed5; padding:12px; border-radius:6px; font-size:13px; color:#c09853; margin-top:15px; word-break:break-all; }
        .crypto-address { font-family:monospace; font-weight:bold; color:#333; margin-top:5px; background:#fff; padding:8px; text-align:center; border:1px solid #edd39e; font-size:14px; }

        /* 文件上传框美化 */
        .file-upload-wrapper {
            margin-top: 12px;
            position: relative;
        }
        .file-upload-input {
            width: 100%;
            padding: 8px;
            background: #fff;
            border: 1px dashed #bbb;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .file-upload-input:hover {
            border-color: var(--accent-color);
            background: #fafafa;
        }

        .checkout-submit-btn { 
            background-color: #25D366; 
            color: white; 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            transition: 0.3s; 
            text-decoration: none; 
            box-sizing: border-box; 
            margin-top: 20px; 
        }
        .checkout-submit-btn:hover { 
            background-color: #1ebd59; 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(37,211,102,0.3);
        }

        footer { 
            background-color: #0d1117; 
            color: #9ca3af; 
            padding: 40px 5% 20px; 
            font-size: 14px; 
            text-align: center; 
            margin-top: 100px; 
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#shop">Shop</a>
        </nav>
    </header>

    <div class="cart-container">
        <h1 class="cart-title">Your Shopping Cart</h1>
        <div id="cart-content"></div>
    </div>

    <footer>
        <div>Copyright © 2026 Peptides Factory. All Rights Reserved.</div>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
            const container = document.getElementById('cart-content');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-msg">
                        <i class="fas fa-shopping-basket"></i>
                        <p>Your shopping cart is empty.</p>
                        <a href="index.html#shop" class="shop-link">Return to Shop</a>
                    </div>
                `;
                return;
            }
            
            let tableHTML = `
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            let subtotal = 0;
            let totalBoxes = 0;
            let orderText = "Hi Peptides Factory, I would like to purchase the following items:\n\n";
            
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                totalBoxes += item.quantity;
                
                tableHTML += `
                    <tr>
                        <td>
                            <div class="item-details">
                                <img src="${item.image}" alt="${item.name}" class="item-image">
                                <div>
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-spec">Specification: ${item.spec}</div>
                                </div>
                            </div>
                        </td>
                        <td>$${item.price.toFixed(2)}</td>
                        <td>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                                <input type="text" class="qty-input" value="${item.quantity}" readonly>
                                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                            </div>
                        </td>
                        <td>$${itemTotal.toFixed(2)}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteItem(${index})">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
                
                orderText += `- ${item.name} (${item.spec}) x${item.quantity} -> $${itemTotal.toFixed(2)}\n`;
            });
            
            tableHTML += `</tbody></table>`;
            
            orderText += `\nTotal Subtotal: $${subtotal.toFixed(2)}\n\nPlease process my order layout.`;
            
            let totalWeight = totalBoxes * 90;

            // 注意：表单加上了 enctype="multipart/form-data" 属性以支持图片文件上传
            let summaryHTML = `
                <div class="cart-summary" style="max-width: 480px;">
                    <form action="https://formspree.io/f/你的Formspree表单ID" method="POST" id="checkout-form" enctype="multipart/form-data">
                        
                        <input type="hidden" name="Purchased_Items" value="${encodeURIComponent(orderText)}">
                        <input type="hidden" name="Total_Boxes" value="${totalBoxes} Boxes">
                        <input type="hidden" name="Total_Weight" id="hidden-total-weight" value="${totalWeight}g">
                        <input type="hidden" name="Final_Grand_Total" id="hidden-grand-total">

                        <div class="summary-row"><span>Products Subtotal:</span><span>$${subtotal.toFixed(2)}</span></div>
                        
                        <div style="background:#fff; padding:15px; border:1px solid #e5e7eb; border-radius:8px; margin-bottom:20px; font-size:14px; line-height:1.7; text-align:left;">
                            <h4 style="margin:0 0 10px 0; color:var(--primary-color); font-size:15px;"><i class="fas fa-truck"></i> Shipping Information</h4>
                            <div style="margin-bottom:10px;"><input type="text" name="Customer_Name" required placeholder="Full Name" class="input-style"></div>
                            <div style="margin-bottom:10px;"><input type="text" name="Shipping_Address" required placeholder="Detailed Shipping Address" class="input-style"></div>
                            <div style="margin-bottom:10px;"><input type="text" name="Zip_Code" required placeholder="Zip / Postal Code" class="input-style"></div>
                            <div style="margin-bottom:10px;"><input type="tel" name="Phone_Number" required placeholder="Phone Number" class="input-style"></div>
                            <div style="margin-bottom:10px;"><input type="text" name="Country" id="input-country" required placeholder="Country (Type to calculate shipping)" class="input-style"></div>
                            <div><input type="email" name="Email_Address" required placeholder="Email Address" class="input-style"></div>
                        </div>

                        <div class="summary-row" style="color:#666; font-size:14px;"><span>Total Quantity:</span><span>${totalBoxes} boxes</span></div>
                        <div class="summary-row" style="color:#666; font-size:14px;"><span>Calculated Net Weight:</span><span>${totalWeight}g</span></div>
                        <div class="summary-row"><span>Stealth Shipping Fee:</span><span id="display-shipping">$0.00</span></div>
                        <div class="summary-row summary-total"><span>Grand Total:</span><span id="display-total">$0.00</span></div>
                        
                        <div style="background:#fff; padding:15px; border:1px solid #e5e7eb; border-radius:8px; margin-top:20px; text-align:left; font-size:14px;">
                            <h4 style="margin:0 0 10px 0; color:var(--primary-color); font-size:15px;"><i class="fab fa-bitcoin"></i> Payment Crypto Network</h4>
                            <select name="Chosen_Crypto" id="crypto-selector" class="input-style">
                                <option value="USDT-TRC20">USDT (TRC20 Network) - Low Fee / Recommended</option>
                                <option value="USDT-ERC20">USDT (ERC20 Network)</option>
                                <option value="Bitcoin">Bitcoin (BTC)</option>
                            </select>

                            <div class="crypto-panel">
                                <span id="crypto-hint">Send equivalent value of USDT (TRC20) to address:</span>
                                <div id="crypto-addr" class="crypto-address">TB9Cr786LZDYdYNqYHZGExbx4oGYqGMiWj</div>
                            </div>
                            
                            <div style="margin-top:12px;">
                                <label style="font-weight:600; display:block; margin-bottom:5px; color:#444;">Paste Payment TxID / Hash *</label>
                                <input type="text" name="Crypto_TxID" required placeholder="Enter transaction hash" class="input-style">
                            </div>

                            <div class="file-upload-wrapper">
                                <label style="font-weight:600; display:block; margin-bottom:5px; color:#444;"><i class="fas fa-camera"></i> Upload Payment Screenshot *</label>
                                <input type="file" name="Payment_Screenshot" accept="image/*" required class="file-upload-input">
                            </div>
                        </div>

                        <button type="submit" class="checkout-submit-btn">
                            <i class="fas fa-lock"></i> Submit Secure Order
                        </button>
                    </form>
                </div>
            `;
            
            container.innerHTML = tableHTML + summaryHTML;

            const countryInput = document.getElementById('input-country');
            const cryptoSelector = document.getElementById('crypto-selector');
            const cryptoHint = document.getElementById('crypto-hint');
            const cryptoAddr = document.getElementById('crypto-addr');

            cryptoSelector.addEventListener('change', function(e) {
                if (e.target.value === 'USDT-TRC20') {
                    cryptoHint.innerText = "Send equivalent value of USDT (TRC20) to address:";
                    cryptoAddr.innerText = "TB9Cr786LZDYdYNqYHZGExbx4oGYqGMiWj";
                } else if (e.target.value === 'USDT-ERC20') {
                    cryptoHint.innerText = "Send equivalent value of USDT (ERC20) to address:";
                    cryptoAddr.innerText = "0xFC8e55dc3C29e2A5895dFC96A9B0703684518574";
                } else if (e.target.value === 'Bitcoin') {
                    cryptoHint.innerText = "Send equivalent value of BTC to official address:";
                    cryptoAddr.innerText = "bc1pqcvdkrk3xre984068cr79ekxm7g0trf9cnqasf3jkp8k4ar47x8q9hc3zg";
                }
            });

            function calculateLiveShipping() {
                let country = countryInput.value.trim().toLowerCase();
                let shippingFee = 0;
                let isUS = country.includes('united states') || country.includes('us') || country.includes('usa');

                if (isUS) {
                    shippingFee = (totalWeight <= 500) ? 80 : 80 + (Math.ceil((totalWeight - 500) / 500) * 10);
                } else {
                    shippingFee = (totalWeight <= 500) ? 60 : 60 + (Math.ceil((totalWeight - 500) / 500) * 10);
                }

                if (country === "") {
                    shippingFee = (totalWeight <= 500) ? 60 : 60 + (Math.ceil((totalWeight - 500) / 500) * 10);
                }

                let finalGrandTotal = subtotal + shippingFee;

                document.getElementById('display-shipping').innerText = '$' + shippingFee.toFixed(2);
                document.getElementById('display-total').innerText = '$' + finalGrandTotal.toFixed(2);
                document.getElementById('hidden-grand-total').value = '$' + finalGrandTotal.toFixed(2);
            }

            countryInput.addEventListener('input', calculateLiveShipping);
            calculateLiveShipping();
        }
        
        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
            cart[index].quantity += change;
            
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            
            localStorage.setItem('peptides_cart', JSON.stringify(cart));
            loadCart();
        }
        
        function deleteItem(index) {
            let cart = JSON.parse(localStorage.getItem('peptides_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('peptides_cart', JSON.stringify(cart));
            loadCart();
        }
        
        loadCart();
    </script>
</body>
</html>
